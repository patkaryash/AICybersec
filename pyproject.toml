[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aicybersec"
version = "0.1.0"
description = "AI-assisted penetration-testing platform - agent foundation"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.1",
    "pwdlib[argon2]>=0.2",
    "pyjwt>=2.8",
    "email-validator>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]

[project.scripts]
aicybersec = "agent_core.__main__:main"

[tool.setuptools]
packages = [
    "agent_core",
    "agent_core.schemas",
    "agent_core.providers",
    "agent_core.planner",
    "agent_core.tools",
    "agent_core.safety",
    "agent_core.runtime",
    "agent_core.state",
    "backend",
    "backend.core",
    "backend.db",
    "backend.api",
    "backend.services",
    "backend.schemas",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -m 'not lab_e2e'"
markers = [
    "lab_e2e: controlled-lab end-to-end scan (requires a running lab target and nmap; run explicitly with -m lab_e2e)",
]
pythonpath = ["."]
